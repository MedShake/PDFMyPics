name: Build Debian package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian package
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"

          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin
          mkdir -p package/usr/lib/pdfmypics
          mkdir -p package/usr/share/locale
          mkdir -p package/usr/share/icons/hicolor/scalable/apps

          cp main.py package/usr/lib/pdfmypics/
          cp -r pdfmypics package/usr/lib/pdfmypics/
          cp -r resources package/usr/lib/pdfmypics/
          cp -r locale/* package/usr/share/locale/
          cp resources/pdfmypics.svg package/usr/share/icons/hicolor/scalable/apps/

          mkdir -p package/usr/share/applications
          cp pdfmypics.desktop package/usr/share/applications/

          cat > package/usr/bin/pdfmypics <<'EOF'
          #!/bin/sh
          exec python3 /usr/lib/pdfmypics/main.py "$@"
          EOF

          chmod +x package/usr/bin/pdfmypics

          cat > package/DEBIAN/control <<EOF
          Package: pdfmypics
          Version: ${VERSION}
          Section: graphics
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.12), python3-gi, gir1.2-gtk-4.0, python3-pil, python3-reportlab
          Maintainer: PDFMyPics
          Description: Create PDF photo contact sheets from a source folder
           Quickly create PDF photo contact sheets from a source folder.
          EOF

          dpkg-deb --build package "pdfmypics_${VERSION}_all.deb"

          ls -lh *.deb

      - name: Upload package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" *.deb --clobber