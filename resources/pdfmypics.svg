<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- back A4 page (behind), with its own faint photo grid -->
  <g transform="rotate(-9 64 64) translate(-5 5)">
    <rect x="27" y="10" width="70" height="99" fill="#EEF2F7" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="36" y="21" width="24" height="20" fill="#CBD5E1"/>
    <rect x="64" y="21" width="24" height="20" fill="#D6DEE8"/>
    <rect x="36" y="45" width="24" height="20" fill="#D6DEE8"/>
    <rect x="64" y="45" width="24" height="20" fill="#CBD5E1"/>
    <rect x="36" y="69" width="24" height="20" fill="#CBD5E1"/>
    <rect x="64" y="69" width="24" height="20" fill="#D6DEE8"/>
  </g>

  <!-- front A4 page -->
  <g transform="rotate(6 64 64) translate(4 -3)">
    <rect x="27" y="10" width="70" height="99" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>

    <!-- photo grid -->
    <rect x="36" y="21" width="24" height="20" fill="#3B82F6"/>
    <rect x="64" y="21" width="24" height="20" fill="#2DD4BF"/>
    <rect x="36" y="45" width="24" height="20" fill="#F59E0B"/>
    <rect x="64" y="45" width="24" height="20" fill="#3B82F6"/>
    <rect x="36" y="69" width="24" height="20" fill="#2DD4BF"/>
    <rect x="64" y="69" width="24" height="20" fill="#F59E0B"/>

    <!-- tiny mountain/sun glyph, hints "photo" -->
    <circle cx="41.5" cy="26" r="2.1" fill="#FFFFFF" opacity="0.85"/>
    <path d="M36 41 L44 32 L49 37 L55 30 L60 41 Z" fill="#FFFFFF" opacity="0.85"/>

    <!-- tiny portrait silhouette, on the bottom-right thumbnail -->
    <circle cx="76" cy="76" r="3.3" fill="#FFFFFF" opacity="0.85"/>
    <path d="M67 89 C67 82.5 71 79.5 76 79.5 C81 79.5 85 82.5 85 89 Z" fill="#FFFFFF" opacity="0.85"/>

    <!-- folded corner accent, nod to PDF export -->
    <path d="M97 10 L97 22 L85 10 Z" fill="#E2483D"/>
  </g>
</svg>
