[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfmypics"
version = "0.1.1"
description = "Create PDF photo contact sheets from a source folder"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

dependencies = [
    "Pillow>=10.0",
    "reportlab>=4.0",
    "PyGObject>=3.48",
]

[project.scripts]
pdfmypics = "pdfmypics.app:main"

[tool.setuptools]
packages = ["pdfmypics"]